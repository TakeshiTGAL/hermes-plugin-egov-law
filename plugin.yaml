name: jp-egov-law
version: 0.1.1
manifest_version: 2
requires_hermes: ">=0.21.4"
description: >
  Silence is not "no amendment" (hermes cron runs), built on the e-Gov Law API. jp-egov-law:weekly-amendments: Mon 09:00 Hermes tz, or host clock. Not shifted to Japan. Unattended weekly turn (≥2 model requests). No daily cap. Agent can start it. Twice = two jobs. Lag ≤7 days. Out: Diet bills, 施行令, 施行規則. Disclosure — HTTPS only to laws.e-gov.go.jp. No key. No plugin-data. No speaker name/id. Cron stores law name and schedule. hermes cron remove <id> (kept after uninstall). Not a sandbox. Deliver: chat, else home. Neither: kept on the job, not sent, not a failure. A bad law name is not an outage. v0.21.4 and v0.21.5: no blueprint; egov_law_search, egov_law_article, egov_law_revisions on every platform, incl. gateways; guests can call them. hermes tools disables a platform. tests/ not loaded.
author: TakeshiTGAL
license: MIT
homepage: https://github.com/TakeshiTGAL/hermes-plugin-egov-law
tags: [law, japan, legal, e-gov, government-data, research]

provides_tools:
  - egov_law_search
  - egov_law_article
  - egov_law_revisions
provides_hooks: []
